<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Segmented Pill</title>
    <link rel="stylesheet" href="../src/style.css" />
    <style>
      :root { color: #18181b; background: #f7f7f8; font-family: Geist, "Helvetica Neue", sans-serif; }
      * { box-sizing: border-box; }
      body { min-width: 320px; margin: 0; padding: 72px 24px; }
      main { width: min(100%, 760px); margin: 0 auto; }
      header { max-width: 580px; margin-bottom: 64px; }
      h1 { margin: 0 0 12px; font-size: clamp(2.25rem, 8vw, 4.75rem); line-height: .94; letter-spacing: -.06em; }
      p { margin: 0; color: #71717a; line-height: 1.6; }
      section { padding: 28px 0; border-top: 1px solid #e4e4e7; }
      .section-head { display: flex; justify-content: space-between; gap: 24px; margin-bottom: 22px; }
      h2 { margin: 0; font-size: .75rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
      output { color: #71717a; font: 500 .75rem/1.4 ui-monospace, monospace; }
      [role="tabpanel"] { margin-top: 20px; color: #3f3f46; }
      [role="tabpanel"][hidden] { display: none; }
      .warm { --segmented-track: #e9e3db; --segmented-focus: #8a5a32; }
      @media (max-width: 520px) {
        body { padding: 48px 16px; }
        header { margin-bottom: 48px; }
        .segmented-control { width: 100%; }
        .segmented-control > button { flex: 1; padding-inline: 10px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Segmented Pill</h1>
        <p>Accessible view switching with a static pill by default and motion when you ask for it.</p>
      </header>

      <section>
        <div class="section-head">
          <h2>Static default</h2>
          <output id="static-value">vanilla</output>
        </div>
        <div class="segmented-control" id="static-control" aria-label="Framework">
          <button id="static-vanilla-tab" type="button" data-value="vanilla" aria-controls="static-vanilla-panel">Vanilla</button>
          <button id="static-react-tab" type="button" data-value="react" aria-controls="static-react-panel">React</button>
          <button id="static-vue-tab" type="button" data-value="vue" aria-controls="static-vue-panel">Vue</button>
        </div>
        <p id="static-vanilla-panel" role="tabpanel" aria-labelledby="static-vanilla-tab">Selected: Vanilla</p>
        <p id="static-react-panel" role="tabpanel" aria-labelledby="static-react-tab" hidden>Selected: React</p>
        <p id="static-vue-panel" role="tabpanel" aria-labelledby="static-vue-tab" hidden>Selected: Vue</p>
      </section>

      <section>
        <div class="section-head">
          <h2>Animated and themed</h2>
          <output id="animated-value">daily</output>
        </div>
        <div class="segmented-control warm" id="animated-control" aria-label="Schedule">
          <button type="button" data-value="daily">Daily</button>
          <button type="button" data-value="weekly">Weekly</button>
          <button type="button" data-value="monthly" disabled>Monthly</button>
        </div>
      </section>
    </main>

    <script type="module">
      import { segmentedControl } from "../src/index.js";

      function showPanel(root, value) {
        for (const panel of root.parentElement.querySelectorAll('[role="tabpanel"]')) {
          panel.hidden = panel.id !== `static-${value}-panel`;
        }
      }

      const staticRoot = document.querySelector("#static-control");
      segmentedControl(staticRoot, {
        onChange(value) {
          document.querySelector("#static-value").value = value;
          showPanel(staticRoot, value);
        },
      });

      segmentedControl(document.querySelector("#animated-control"), {
        animated: true,
        onChange(value) {
          document.querySelector("#animated-value").value = value;
        },
      });
    </script>
  </body>
</html>
